name: Build Hamzawy Sat APKs
on:
  push:
    branches:
      - main
      - feature/sync-web-updates-20261103
      - hamzawy-sat-brand-conversion
    paths:
      - 'App.js'
      - 'src/**'
      - 'tests/**'
      - 'app.json'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Verify app before APK builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run regression tests
        run: npm test
      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/hamzawy-sat-export

  build:
    name: Build ${{ matrix.variant }} APK
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: modern
            architecture: arm64-v8a
          - variant: legacy
            architecture: armeabi-v7a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Android project with Hamzawy Sat logo and splash
        run: npx expo prebuild --platform android --clean
      - name: Build ${{ matrix.variant }} release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease "-PreactNativeArchitectures=${{ matrix.architecture }}"
      - name: Name APK and report size
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/hamzawy-sat-${{ matrix.variant }}-${{ matrix.architecture }}.apk"
          ls -lh artifacts/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hamzawy-sat-${{ matrix.variant }}-${{ matrix.architecture }}-apk
          path: artifacts/hamzawy-sat-${{ matrix.variant }}-${{ matrix.architecture }}.apk
          if-no-files-found: error
          retention-days: 30
