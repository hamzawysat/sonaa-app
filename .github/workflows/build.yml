name: Build APK Final
on:
  push:
    branches: [ main, 'feature/sync-web-updates-20261103', 'fix/client-app-catalog-first-load' ]
    paths:
      - 'App.js'
      - 'src/**'
      - 'tests/**'
      - 'app.json'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate app icons and splash from official logo
        run: |
          mkdir -p assets
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("assets/LOGO_UPLOAD_HERE/logo.png")
          if not source.is_file():
              raise SystemExit("Official logo missing: assets/LOGO_UPLOAD_HERE/logo.png")
          logo = Image.open(source).convert("RGBA")
          if logo.width < 128 or logo.height < 128:
              raise SystemExit("Official logo image is unexpectedly small")
          # Keep the complete HS mark inside Android's adaptive-icon safe zone.
          # A transparent 1024px canvas with a 620px contained logo prevents edge clipping.
          logo.thumbnail((620, 620), Image.Resampling.LANCZOS)
          foreground = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          x = (1024 - logo.width) // 2
          y = (1024 - logo.height) // 2
          foreground.alpha_composite(logo, (x, y))
          foreground.save("assets/icon.png")
          foreground.save("assets/adaptive-icon.png")

          # Splash artwork gets a little more room but remains fully contained.
          splash_logo = Image.open(source).convert("RGBA")
          splash_logo.thumbnail((720, 720), Image.Resampling.LANCZOS)
          splash = Image.new("RGBA", (1024, 1024), (244, 248, 252, 255))
          sx = (1024 - splash_logo.width) // 2
          sy = (1024 - splash_logo.height) // 2
          splash.alpha_composite(splash_logo, (sx, sy))
          splash.save("assets/splash-icon.png")
          splash.convert("RGB").save("assets/splash.png", quality=95)
          PY
      - name: Run regression tests
        run: npm test
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sonaa-apk-final
          path: android/app/build/outputs/apk/release/app-release.apk
